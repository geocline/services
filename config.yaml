    name: Recipe PWA
    # Moved to kuntas-mac-mini 2026-07-26 so it survives the laptop sleeping.
    # Reached over Tailscale with key-based SSH; launchd on that host owns the
    # lifecycle, so start/stop are launchctl load/unload there.
    host: kunta@100.81.86.20
    dir: /Users/kunta/projects/recipe-pwa
    command: []
    pid_file: /Users/geo/Claude Projects/.services/pids/recipe.pid
